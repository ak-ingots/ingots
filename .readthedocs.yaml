# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    # uv instead of pip: the `doc` dependency group from uv.lock, installed
    # into the environment Read the Docs builds with.
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --group doc
    # docs/modules/ is gitignored: regenerate it with the same flags as locally.
    pre_build:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" make apidoc

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf
